<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bmt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#0F0F16" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>

    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="bmt-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD" />
      <stop offset="25%" stop-color="#F5E27A" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#785307" />
    </linearGradient>

    <!-- Bevel Light Gold -->
    <linearGradient id="bmt-gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F5E27A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="bmt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Card -->
  <rect width="64" height="64" rx="16" fill="url(#bmt-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#bmt-gold)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#bmt-glow)" />

  <!-- Outer Dining Plate Accent Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="23" fill="none" stroke="url(#bmt-gold)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.4" />
  <ellipse cx="32" cy="47" rx="18" ry="3.5" fill="url(#bmt-gold)" opacity="0.25" />

  <!-- Monogram 'B' (Regal Luxury Typography + Plate Motif) -->
  <g transform="translate(0, 0)">
    <!-- Main Stem -->
    <path d="M 21 16 H 34 C 41 16, 44 19.5, 44 24 C 44 27.5, 41.5 30, 37.5 30.8 C 42.5 31.8, 45 35, 45 39.5 C 45 44.5, 41 48, 33.5 48 H 21 Z" fill="url(#bmt-gold)" />
    
    <!-- Cutouts for 'B' loops -->
    <path d="M 27 21 H 33 C 36.5 21, 38 22.5, 38 24.8 C 38 27.2, 36.5 28.5, 33 28.5 H 27 Z" fill="#0E0E14" />
    <path d="M 27 33.5 H 33.5 C 37.5 33.5, 39 35.2, 39 37.8 C 39 40.5, 37.2 42.5, 33 42.5 H 27 Z" fill="#0E0E14" />
    
    <!-- Serif Base Caps -->
    <path d="M 18.5 16 H 24.5 M 18.5 48 H 24.5" stroke="url(#bmt-gold)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Subtle Inner Highlight Rim -->
    <path d="M 22 17.5 H 33 C 38.5 17.5, 41 19.5, 41 23.5" stroke="url(#bmt-gold-light)" stroke-width="1" stroke-linecap="round" fill="none" />
  </g>

  <!-- Sparkling Luxury Star -->
  <path d="M 47 13 L 48.2 15.8 L 51 17 L 48.2 18.2 L 47 21 L 45.8 18.2 L 43 17 L 45.8 15.8 Z" fill="url(#bmt-gold)" />
  <circle cx="17" cy="18" r="1.5" fill="url(#bmt-gold)" opacity="0.7" />
</svg>
