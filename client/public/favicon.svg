<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Ultra High-Contrast Metallic Gold -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="35%" stop-color="#F5E27A" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B38918" />
    </linearGradient>

    <!-- Subtle Glow for Maximum Visibility -->
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="18" fill="url(#fav-bg)" />
  
  <!-- Outer Gold Border Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#fav-gold)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#fav-glow)" />

  <!-- Bold, High-Visibility 'B' Monogram -->
  <!-- Main B Shape -->
  <path 
    d="M 19 13 H 35 C 42.5 13, 47 16.5, 47 22 C 47 26.2, 44 28.8, 39.5 29.8 C 45 30.8, 48 34, 48 39.5 C 48 45.5, 43 49, 34.5 49 H 19 Z" 
    fill="url(#fav-gold)" 
  />

  <!-- Top Inner Cutout -->
  <path 
    d="M 27 19.5 H 34 C 37.8 19.5, 39.8 20.8, 39.8 23 C 39.8 25.2, 37.8 26.5, 34 26.5 H 27 Z" 
    fill="#0a0a0c" 
  />

  <!-- Bottom Inner Cutout -->
  <path 
    d="M 27 33 H 34.5 C 38.5 33, 40.8 34.5, 40.8 37 C 40.8 39.5, 38.5 41, 34.5 41 H 27 Z" 
    fill="#0a0a0c" 
  />
</svg>
