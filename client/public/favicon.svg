<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Ultra High-Contrast 3D Champagne Gold Gradient -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC" />
      <stop offset="25%" stop-color="#F5E27A" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#6E5200" />
    </linearGradient>

    <!-- Contrast Drop Shadow so favicon is perfectly visible on BOTH Dark & Light Browser Tabs -->
    <filter id="fav-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 100% TRANSPARENT BACKGROUND - NO BOX, NO CONTAINER, NO BORDER -->

  <!-- Standalone Luxury Serif 'B' Monogram -->
  <g filter="url(#fav-shadow)">
    <path 
      fill-rule="evenodd" 
      d="
        M 8 7 
        H 36 
        C 45.5 7, 51 11, 51 18.5 
        C 51 23.5, 47.5 26.5, 42 28 
        C 49 29.5, 54 33.5, 54 41.5 
        C 54 50, 47 53.5, 36 53.5 
        H 8 
        V 47 
        H 14.5 
        V 13.5 
        H 8 
        Z
        
        M 22 13.5 
        H 35 
        C 40.5 13.5, 43.5 15.2, 43.5 18.5 
        C 43.5 21.8, 40.5 23.5, 35 23.5 
        H 22 
        Z
        
        M 22 29.5 
        H 36 
        C 42 29.5, 45.5 31.5, 45.5 35.8 
        C 45.5 40.1, 42 42.5, 36 42.5 
        H 22 
        Z
      " 
      fill="url(#fav-gold)" 
    />
  </g>
</svg>
